name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Taeglicher Neubau: "heute" ist das Build-Datum (lib/vacations.ts). Ohne
  # ihn blieben vergangene Urlaube stehen, bis zufaellig wieder jemand pusht.
  # 02:30 UTC = 03:30/04:30 deutscher Zeit.
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Datumslogik in Praxiszeit, nicht in der UTC-Zeit des Runners.
  TZ: Europe/Berlin

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://praxis-chernova.de

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
