# Bearbeitungsformular fuer das Praxisteam in Pages CMS (https://pagescms.org).
#
# WICHTIG: Eine Vertretungspraxis ist ein Eintrag UNTERHALB eines Zeitraums,
# kein eigener Zeitraum. Bis August 2026 kannte dieses Formular nur eine
# einzige Vertretung ("substitute", Einzahl); das Praxisteam hat deshalb
# denselben Urlaub mehrfach angelegt, einmal je Vertretungspraxis, und auf der
# Website erschienen daraus mehrere Urlaube. Seitdem ist "substitutes" eine
# Liste. Die Website fasst zusaetzlich Zeitraeume mit identischem Datum wieder
# zusammen (lib/vacation-logic.ts, mergePeriodsByRange), damit alte Eintraege
# richtig dargestellt werden, ohne dass jemand sie nachpflegen muss.
content:
  - name: vacation
    label: "Urlaub / Schliesszeiten"
    type: file
    path: content/vacation.json
    format: json
    fields:
      - name: periods
        label: "Schliesszeiten"
        description: "Alle Zeitraeume, in denen die Praxis geschlossen ist. Mit dem Plus-Symbol einen neuen Zeitraum hinzufuegen. Abgelaufene Eintraege blendet die Website automatisch aus und koennen geloescht werden. Bitte je Urlaub nur EINEN Eintrag anlegen - mehrere Vertretungspraxen tragen Sie weiter unten im selben Eintrag ein."
        type: object
        list:
          collapsible:
            summary: "{start} bis {end}"
        fields:
          - name: start
            label: "Von (erster Schliesstag)"
            description: "Erster Tag, an dem die Praxis geschlossen ist."
            type: date
            required: true
            options:
              format: yyyy-MM-dd

          - name: end
            label: "Bis (letzter Schliesstag)"
            description: "Letzter Tag der Schliessung. Bei nur einem Tag bitte denselben Tag wie oben eintragen."
            type: date
            required: true
            options:
              format: yyyy-MM-dd

          - name: note
            label: "Hinweis (optional)"
            description: "Optionaler Text, z. B. 'Wir sind wegen Betriebsurlaub nicht erreichbar'. Kann leer bleiben."
            type: text

          - name: substitutes
            label: "Vertretungspraxen (optional)"
            description: "Hier ALLE Vertretungspraxen fuer diesen Zeitraum eintragen. Mit dem Plus-Symbol weitere hinzufuegen - bitte dafuer KEINEN zweiten Urlaub anlegen. Die Website zeigt alle Eintraege untereinander an. Wenn es keine Vertretung gibt, leer lassen."
            type: object
            list:
              collapsible:
                summary: "{name}"
            fields:
              - name: name
                label: "Name der Praxis / des Arztes"
                description: "Name der vertretenden Praxis, z. B. 'Hausarztpraxis Dr. Mustermann'."
                type: string
              - name: street
                label: "Strasse und Hausnummer"
                description: "Anschrift der Vertretungspraxis. Kann leer bleiben."
                type: string
              - name: postalCode
                label: "Postleitzahl"
                description: "z. B. 33647. Kann leer bleiben."
                type: string
              - name: city
                label: "Ort"
                description: "z. B. Bielefeld. Kann leer bleiben."
                type: string
              - name: phone
                label: "Telefon"
                description: "Telefonnummer der Vertretung als Klartext, z. B. 0521 123456."
                type: string
              - name: note
                label: "Zusatzhinweis zur Vertretung (optional)"
                description: "Optionaler Text, z. B. 'Nur telefonisch erreichbar' oder 'Online-Termine unter ...'. Kann leer bleiben."
                type: text
